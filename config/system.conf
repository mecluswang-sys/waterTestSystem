# PLC连接配置
plc.ip = 192.168.33.1
plc.rack = 0
plc.slot = 1
plc.auto_connect_on_start = false

# 数据采集配置（单位：毫秒）
# 10 Hz 轮询 → 100 ms
data.collection_interval = 100

# 压力传感器配置
pressure.max_limit = 1000
pressure.min_limit = 0
pressure.alarm_threshold = 950
pressure.count = 3

# 流量计配置
# 通信方式：modbus/plc
# - modbus: 上位机直连串口读流量计
# - plc:    读取旧版 DB2 结构（status+real）
# - plc_buffer: 读取 PLC 采集缓冲区（DB1 连续寄存器）
flow.source = plc_buffer
# Modbus RTU 串口参数（用于现场临时直连调试）
flow.modbus.port = COM8
flow.modbus.baud = 9600
flow.modbus.data_bits = 8
flow.modbus.parity = N
flow.modbus.stop_bits = 1
flow.modbus.slave_id = 1
# 寄存器地址（设备手册：90=正向累计流量, 98=瞬时流量）
flow.modbus.reg_total = 90
flow.modbus.reg_rate = 98
flow.modbus.reg_unit = 105

# PLC 缓冲区解析参数（PLC 侧仅采集 Modbus 寄存器到缓冲区时使用）
# 当前现场：流量计数据从 DB1 的 word[136] 开始（即第9段）
flow.plc_buffer.db_number = 1
flow.plc_buffer.word_offset = 136
# 兼容旧配置（未设置 word_offset 时才使用）
flow.plc_buffer.byte_offset = 272
flow.plc_buffer.word_count = 18
flow.plc_buffer.reg_total_index = 0
flow.plc_buffer.reg_rate_index = 8
flow.plc_buffer.reg_unit_index = 15
flow.plc_buffer.reg_empty_pipe_alarm_index = 16
flow.plc_buffer.reg_excitation_alarm_index = 17
# primary 全0时按候选 word 偏移自动探测（逗号分隔）
flow.plc_buffer.probe_word_offsets = 136,119,154

flow.max_rate = 100
flow.alarm_threshold = 95

# 系统配置
system.emergency_stop_enabled = true
system.auto_recovery = false
system.log_level = info

# HMI（测试准备区流程图）交互
# - 现场默认关闭拖拽，避免误操作
# - 如需调整布局，可临时改为 true
ui.hmi.drag_enabled = false

# HMI 主题配色
# - graphite：石墨灰（默认，已保存当前方案）
# - light：灰白底
# - ocean：海蓝青
#
# 全局 UI 主题（影响整个软件：窗口/Tab/按钮/表格等）
# - 若未设置 ui.theme，则会回退使用 ui.hmi.theme
ui.theme = graphite

# HMI（测试准备区流程图）主题
# - 可设为 graphite/light/ocean
# - 也可设为 auto（跟随 ui.theme）
ui.hmi.theme = auto

# 是否在流程图中显示压力传感器卡片（PS1/PS2/PS3）
ui.hmi.show_pressure_sensors = true

# 报警配置
alarm.enable_sound = true
alarm.enable_email = false
alarm.email_address = admin@example.com

# 压力工程量缩放
# - 当前 PLC 的 MainValue_Real 单位为 kPa，因此保持 scale=1
# - 当前上位机内部与 UI 显示统一按 kPa 处理
db.pressure.scale = 1

# 当前现场无温度通道
temp.count = 0

# ============================================================
# 电动调节阀配置 (AOX-Q-005~010 / SRCU1TA)
# 接线：AO 命令 → 端子10-11(4-20mA), AI 反馈 ← 端子16-17(4-20mA)
#       DI 开到位 ← 端子12-13, DI 关到位 ← 端子14-15
#       DI 综合报警 ← 端子22-23
# ------------------------------------------------------------
# S7-1200 地址说明（以字节偏移表示）：
#   AO: SM1232 外设输出通道，QW80=byte80, QW82=byte82
#   AI: SM1231 外设输入通道，IW96=byte96, IW98=byte98
#   DI: 输入映像区字节偏移(byte) + 位偏移(bit)
# ------------------------------------------------------------

# 调节阀1
valve.1.ao.byte_offset = 80
valve.1.ai.byte_offset = 96
valve.1.di.open_limit.byte  = 1
valve.1.di.open_limit.bit   = 0
valve.1.di.close_limit.byte = 1
valve.1.di.close_limit.bit  = 1
valve.1.di.alarm.byte       = 1
valve.1.di.alarm.bit        = 2
valve.1.pid.kp = 0.5
valve.1.pid.ki = 0.01
valve.1.pid.kd = 0.1
# 压力反馈 AI（4-20mA，SM1231 外设区字节偏移）和量程(kPa)
valve.1.pressure_ai.byte_offset = 100
valve.1.pressure_range_min = 0
valve.1.pressure_range_max = 1000

# 调节阀2
valve.2.ao.byte_offset = 82
valve.2.ai.byte_offset = 98
valve.2.di.open_limit.byte  = 1
valve.2.di.open_limit.bit   = 3
valve.2.di.close_limit.byte = 1
valve.2.di.close_limit.bit  = 4
valve.2.di.alarm.byte       = 1
valve.2.di.alarm.bit        = 5
valve.2.pid.kp = 0.5
valve.2.pid.ki = 0.01
valve.2.pid.kd = 0.1
# 压力反馈 AI（4-20mA，SM1231 外设区字节偏移）和量程(kPa)
valve.2.pressure_ai.byte_offset = 102
valve.2.pressure_range_min = 0
valve.2.pressure_range_max = 1000

# 压力传感器缓冲区配置（PLC 侧：DB1 下 ARRAY[0..279] OF WORD）
# 当前按每路 17 WORD 连续排列
db.sensor.number = 1

# 每路结构（相对 itemBase）：
# - word[9] = 压力单位码（HART 单位表）
# - word[2] = 压力低16位
# - word[3] = 压力高16位
# - 两字合并为浮点（low/high）
# - word[11] = 显示小数位
# - word[13]/word[14] = 偏移值 float（低/高16位）
# - word[15]/word[16] = 增益值 float（低/高16位）
# 当前按 1/2/3 号读取：
# - 1号: base + 0*34
# - 2号: base + 1*34
# - 3号: base + 2*34
db.sensor.base_offset = 0
db.sensor.item_size = 34
db.sensor.base_word_index = 0
db.sensor.item_words = 17
db.sensor.unit.word_index = 9
db.sensor.main_value_real.offset = 4
db.sensor.main_value_real.word_order = CDAB
db.sensor.main_value_float.low_word_index = 2
db.sensor.main_value_float.high_word_index = 3
db.sensor.main_decimal.word_index = 11
db.sensor.offset.low_word_index = 13
db.sensor.offset.high_word_index = 14
db.sensor.gain.low_word_index = 15
db.sensor.gain.high_word_index = 16
db.sensor.main_decimal.offset = -1

# 可选：按通道覆盖参数（默认不需要）
# db.sensor.2.base_offset = 0
# db.sensor.2.item_size = 108
# db.sensor.2.main_value_real.offset = 4
# db.sensor.2.main_decimal.offset = -1

# 温度映射参数已停用（当前项目无温度点位）

# 诊断与页面刷新开关
diag.skip_data_collection_on_connect = false
diag.skip_panel_updates_on_connect = false
diag.skip_plc_connect_on_connect = false
ui.enable_preparation_live_update = true
ui.enable_test_live_update = true
ui.enable_auto_test_live_update = true
ui.enable_station1_panel = true