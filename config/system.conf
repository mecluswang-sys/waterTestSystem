ui.hmi.drag_enabled = false

# HMI 主题配色
# - graphite：石墨灰（默认，已保存当前方案）
# - light：灰白底
# - ocean：海蓝青
#
# 全局 UI 主题（影响整个软件：窗口/Tab/按钮/表格等）
# - 若未设置 ui.theme，则会回退使用 ui.hmi.theme
ui.theme = graphite

# HMI（测试准备区流程图）主题
# - 可设�?graphite/light/ocean
# - 也可设为 auto（跟�?ui.theme�?
ui.hmi.theme = auto

# 是否在流程图中显示压力传感器卡片（PS1/PS2/PS3�?
ui.hmi.show_pressure_sensors = true

# 报警配置
alarm.enable_sound = true
alarm.enable_email = false
alarm.email_address = admin@example.com

# 压力工程量缩�?
# - 当前 PLC �?MainValue_Real 单位�?kPa，因此保�?scale=1
# - 当前上位机内部与 UI 显示统一�?kPa 处理
db.pressure.scale = 1

# 当前现场无温度通道
temp.count = 0

# ============================================================
# 电动调节阀配置 (AOX-Q-005~010 / SRCU1TA)
# 接线：AO 命令 �?端子10-11(4-20mA), AI 反馈 �?端子16-17(4-20mA)
#       DI 开到位 �?端子12-13, DI 关到�?�?端子14-15
#       DI 综合报警 �?端子22-23
# ------------------------------------------------------------
# S7-1200 地址说明（以字节偏移表示）：
#   AO: SM1232 外设输出通道，QW80=byte80, QW82=byte82
#   AI: SM1231 外设输入通道，IW96=byte96, IW98=byte98
#   DI: 输入映像区字节偏�?byte) + 位偏�?bit)
# ------------------------------------------------------------

# 调节阀数量（可扩展到更多 4-20mA 阀）
valve.count = 2

# 调节阀1
valve.1.ao.byte_offset = 80
valve.1.ai.byte_offset = 96
valve.1.di.open_limit.byte  = 1
valve.1.di.open_limit.bit   = 0
valve.1.di.close_limit.byte = 1
valve.1.di.close_limit.bit  = 1
valve.1.di.alarm.byte       = 1
valve.1.di.alarm.bit        = 2
valve.1.pid.kp = 0.5
valve.1.pid.ki = 0.01
valve.1.pid.kd = 0.1
# 压力反馈 AI�?-20mA，SM1231 外设区字节偏移）和量�?kPa)
valve.1.pressure_ai.byte_offset = 100
valve.1.pressure_range_min = 0
valve.1.pressure_range_max = 1000

# 调节阀2
valve.2.ao.byte_offset = 82
valve.2.ai.byte_offset = 98
valve.2.di.open_limit.byte  = 1
valve.2.di.open_limit.bit   = 3
valve.2.di.close_limit.byte = 1
valve.2.di.close_limit.bit  = 4
valve.2.di.alarm.byte       = 1
valve.2.di.alarm.bit        = 5
valve.2.pid.kp = 0.5
valve.2.pid.ki = 0.01
valve.2.pid.kd = 0.1
# 压力反馈 AI�?-20mA，SM1231 外设区字节偏移）和量�?kPa)
valve.2.pressure_ai.byte_offset = 102
valve.2.pressure_range_min = 0
valve.2.pressure_range_max = 1000

# 调节阀3（后续测试时可把 valve.count 改为 3 并按现场地址修改）
valve.3.ao.byte_offset = 84
valve.3.ai.byte_offset = 100
valve.3.di.open_limit.byte  = 1
valve.3.di.open_limit.bit   = 6
valve.3.di.close_limit.byte = 1
valve.3.di.close_limit.bit  = 7
valve.3.di.alarm.byte       = 2
valve.3.di.alarm.bit        = 0
valve.3.pid.kp = 0.5
valve.3.pid.ki = 0.01
valve.3.pid.kd = 0.1
valve.3.pressure_ai.byte_offset = 104
valve.3.pressure_range_min = 0
valve.3.pressure_range_max = 1000

