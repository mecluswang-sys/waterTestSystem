# PLC连接配置
plc.ip = 192.168.33.1
plc.rack = 0
plc.slot = 1

# 数据采集配置（单位：毫秒）
# 10 Hz 轮询 → 100 ms
data.collection_interval = 100

# 压力传感器配置
pressure.max_limit = 1000000
pressure.min_limit = 0
pressure.alarm_threshold = 950000
pressure.count = 4   

# 流量计配置
flow.max_rate = 100
flow.alarm_threshold = 95

# 系统配置
system.emergency_stop_enabled = true
system.auto_recovery = false
system.log_level = info

# HMI（测试准备区流程图）交互
# - 现场默认关闭拖拽，避免误操作
# - 如需调整布局，可临时改为 true
ui.hmi.drag_enabled = false

# HMI 主题配色
# - graphite：石墨灰（默认，已保存当前方案）
# - light：灰白底
# - ocean：海蓝青
#
# 全局 UI 主题（影响整个软件：窗口/Tab/按钮/表格等）
# - 若未设置 ui.theme，则会回退使用 ui.hmi.theme
ui.theme = graphite

# HMI（测试准备区流程图）主题
# - 可设为 graphite/light/ocean
# - 也可设为 auto（跟随 ui.theme）
ui.hmi.theme = auto

# 是否在流程图中显示压力传感器卡片（PS1/PS2/PS3）
ui.hmi.show_pressure_sensors = true

# 报警配置
alarm.enable_sound = true
alarm.enable_email = false
alarm.email_address = admin@example.com

# PLC 压力DB映射（Pressure_kPa）
# - 若仅单通道，可忽略 item_size（或设为0），直接读 value_offset
# - 若多通道，Pressure_kPa(i) 偏移 = (i-1)*item_size + value_offset
# - 也支持每通道覆盖：db.pressure.<id>.number/item_size/value_offset（优先级高于全局）
db.pressure.number = 1
# 若仅单通道，请设为0（直接使用 value_offset 作为绝对偏移）
db.pressure.item_size = 0
db.pressure.value_offset = 2
db.pressure.scale = 1000     # PLC为kPa → 显示为Pa：乘1000；若PLC已为Pa则设为1

# 示例：如存在第2个压力传感器且地址不同，可取消下面注释：
# db.pressure.2.number = 1
# db.pressure.2.item_size = 8
# db.pressure.2.value_offset = 2
# db.pressure.2.scale = 1000

temp.count = 4

# 传感器汇总DB（DB_Sensor）
# 若PLC将压力/温度数组集中在单一DB中（如DB1），可启用以下配置：
# - Raw_Pressure:   Array[0..3] of Int    （2字节）
# - Pressur_kPa:    Array[0..3] of Real   （4字节）
# - Raw_Temp:       Array[0..3] of Int    （2字节）
# - Temp_Celsius:   Array[0..3] of Real   （4字节）
# 下述默认偏移按典型顺序推断：Raw_Pressure(0..7) → Pressur_kPa(8..23) → Raw_Temp(24..31) → Temp_Celsius(32..47)
db.sensor.number = 1
db.sensor.pressure_kpa.base_offset = 8
db.sensor.pressure_kpa.element_size = 4
db.sensor.temp_c.base_offset = 32
db.sensor.temp_c.element_size = 4

# PLC 温度DB映射（Temperature_C）
# - 全局：db.temp.number/item_size/value_offset
# - 多通道：Temp(i) 偏移 = (i-1)*item_size + value_offset （当 item_size>0）
# - 每通道覆盖：db.temp.<id>.number/item_size/value_offset（优先级更高）
# - 兼容旧配置：若未设置 db.temp.*，将回退使用 db.temp1.number/item_size/value_offset
db.temp.number = 6
# 若仅单通道或使用绝对偏移，请设为0（直接使用 value_offset）
db.temp.item_size = 0
db.temp.value_offset = 2

# 示例：按通道覆盖不同偏移（如第2通道在偏移10）：
# db.temp.2.number = 6
# db.temp.2.item_size = 0
# db.temp.2.value_offset = 10

# 旧版兼容键（可保留或删除）：
# db.temp1.number = 6
# db.temp1.item_size = 0
# db.temp1.value_offset = 2
# db.temp1.position = 2
