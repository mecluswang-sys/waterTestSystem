pressure.alarm_threshold = 950
pressure.count = 8

# 流量计配�?
# 通信方式：modbus/plc
# - modbus: 上位机直连串口读流量�?
# - plc:    读取旧版 DB2 结构（status+real�?
# - plc_buffer: 读取 PLC 采集缓冲区（DB1 连续寄存器）
flow.source = plc_buffer
# Modbus RTU 串口参数（用于现场临时直连调试）
flow.modbus.port = COM8
flow.modbus.baud = 9600
flow.modbus.data_bits = 8
flow.modbus.parity = N
flow.modbus.stop_bits = 1
flow.modbus.slave_id = 1
# 寄存器地址（设备手册：90=正向累计流量, 98=瞬时流量�?
flow.modbus.reg_total = 90
flow.modbus.reg_rate = 98
flow.modbus.reg_unit = 105

# PLC 缓冲区解析参数（PLC 侧仅采集 Modbus 寄存器到缓冲区时使用�?
# 当前现场：流量计数据�?DB1 �?word[136] 开始（即第9段）
flow.plc_buffer.db_number = 1
flow.plc_buffer.word_offset = 136
# 兼容旧配置（未设�?word_offset 时才使用�?
flow.plc_buffer.byte_offset = 272
flow.plc_buffer.word_count = 18
flow.plc_buffer.reg_total_index = 0
flow.plc_buffer.reg_rate_index = 8
flow.plc_buffer.reg_unit_index = 15
flow.plc_buffer.reg_empty_pipe_alarm_index = 16
flow.plc_buffer.reg_excitation_alarm_index = 17
# primary �?时按候�?word 偏移自动探测（逗号分隔�?
flow.plc_buffer.probe_word_offsets = 136,119,154

flow.max_rate = 100
flow.alarm_threshold = 95

# KEYSIGHT E3634A 直流电源（RS232 / SCPI）
# - 默认关闭，启用后由 DeviceManager 的 E3634A 接口进行控制
# - 常用命令：SYST:REM, VOLT, CURR, OUTP, MEAS:VOLT?, MEAS:CURR?, *IDN?
e3634a.enabled = true
e3634a.rs232.port = COM9
e3634a.rs232.baud = 9600
e3634a.rs232.data_bits = 8
e3634a.rs232.parity = N
e3634a.rs232.stop_bits = 1
e3634a.rs232.write_timeout_ms = 600
e3634a.rs232.read_timeout_ms = 900
# 软件侧保护上限（超出将拒绝下发）
e3634a.limit.max_voltage = 50
e3634a.limit.max_current = 7

# 系统配置
system.emergency_stop_enabled = true
system.auto_recovery = false
system.log_level = info

# HMI（测试准备区流程图）交互
