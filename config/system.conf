# ============================================================
# 电动调节阀配置 (AOX-Q-005~010 / SRCU1TA)
# 接线：AO 命令 �?端子10-11(4-20mA), AI 反馈 �?端子16-17(4-20mA)
#       DI 开到位 �?端子12-13, DI 关到�?�?端子14-15
#       DI 综合报警 �?端子22-23
# ------------------------------------------------------------
# S7-1200 地址说明（以字节偏移表示）：
#   AO: SM1232 外设输出通道，QW80=byte80, QW82=byte82
#   AI: SM1231 外设输入通道，IW96=byte96, IW98=byte98
#   DI: 输入映像区字节偏�?byte) + 位偏�?bit)
# ------------------------------------------------------------

# 调节阀数量（可扩展到更多 4-20mA 阀）
valve.count = 2

# 调节阀1
valve.1.ao.source = merker_real
valve.1.ai.source = merker_real
# MD26：电动调压阀1开度控制写入（输入即开度百分比，0-100）
valve.1.ao.merker_real.byte_offset = 26
# MD21：电动调压阀1开度反馈
valve.1.ai.merker_real.byte_offset = 21

# 调节阀2
valve.2.ao.source = merker_real
valve.2.ai.source = merker_real
# MD36：电动调压阀2开度控制写入（输入即开度百分比，0-100）
valve.2.ao.merker_real.byte_offset = 36
# MD31：电动调压阀2开度反馈
valve.2.ai.merker_real.byte_offset = 31

# 调节阀3（后续测试时可把 valve.count 改为 3 并按现场地址修改）
valve.3.ao.byte_offset = 84
valve.3.ai.byte_offset = 100
valve.3.di.open_limit.byte  = 1
valve.3.di.open_limit.bit   = 6
valve.3.di.close_limit.byte = 1
valve.3.di.close_limit.bit  = 7
valve.3.di.alarm.byte       = 2
valve.3.di.alarm.bit        = 0
valve.3.pid.kp = 0.5
valve.3.pid.ki = 0.01
valve.3.pid.kd = 0.1
valve.3.pressure_ai.byte_offset = 104
valve.3.pressure_range_min = 0
valve.3.pressure_range_max = 1000

# PLC 侧已转换压力（推荐）：直接读取 DB1 中 SensorKpa 数组（REAL）
# 当前现场确认：DB1 中 SensorKpa 类型为 ARRAY[1..8] OF REAL，起始偏移 DBD628
db.sensor.kpa.db_number = 1
db.sensor.kpa.base_offset = 628

# 每路结构（相对 itemBase）：
# - word[9] = 压力单位码（HART 单位表）
# - word[2] = 压力低 16 位
# - word[3] = 压力高 16 位
# - 两字合并为浮点（low/high）
# - word[11] = 显示小数位
# - word[13]/word[14] = 偏移量 float（低/高16位）
# - word[15]/word[16] = 增益 float（低/高16位）
# 当前 1/2/3 号读取：
# - 1号: base + 0*34
# - 2号: base + 1*34
# - 3号: base + 2*34
# 通用公式：itemBase = base + (sensor_id - 1) * 34
db.sensor.base_offset = 0
db.sensor.item_size = 34
db.sensor.base_word_index = 0
db.sensor.item_words = 17
db.sensor.unit.word_index = 9
db.sensor.main_value_real.offset = 4
db.sensor.main_value_real.word_order = CDAB
db.sensor.main_value_float.low_word_index = 2
db.sensor.main_value_float.high_word_index = 3
db.sensor.main_decimal.word_index = 11
db.sensor.offset.low_word_index = 13
db.sensor.offset.high_word_index = 14
db.sensor.gain.low_word_index = 15
db.sensor.gain.high_word_index = 16
db.sensor.main_decimal.offset = -1

# 备注：以上 db.sensor.* 原始字解析参数用于兼容旧链路；
# 当前 C++ 压力读取已切换为 db.sensor.kpa.* 直读 REAL 数组。

# 可选：按通道覆盖参数（默认不需要）
